<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="robots" content="{{ROBOTS}}">
  <link rel="canonical" href="{{CANONICAL}}">
  <meta property="og:site_name" content="VELUNE">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:image" content="{{OG_IMAGE}}">
  <meta name="theme-color" content="#F4F7FC">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/styles.css">
  {{JSONLD}}
</head>
<body data-page="contact">
<!--@header-->

<main id="main">
  <section class="section support-section">
    <div class="container support-container">

      <!-- ====================================================
           STEP 1: Start chat — show when no active chat
           ==================================================== -->
      <div class="wa-start" data-wa-start>
        <div class="wa-start__card">
          <div class="wa-start__logo">
            <svg viewBox="0 0 40 40" fill="none" aria-hidden="true" width="40" height="40">
              <circle cx="20" cy="20" r="20" fill="#25D366"/>
              <path d="M20 8C13.37 8 8 13.37 8 20c0 2.13.56 4.12 1.53 5.85L8 32l6.34-1.51A11.93 11.93 0 0 0 20 32c6.63 0 12-5.37 12-12S26.63 8 20 8Zm6.07 16.43c-.26.72-1.52 1.38-2.08 1.46-.53.08-1.2.11-1.94-.12a17.6 17.6 0 0 1-1.76-.65C17.6 23.9 15.5 21.6 15 20.87c-.5-.72-.5-1.36-.5-1.36s0-.46.34-.71l.46-.03c.16 0 .32.01.46.32l.68 1.6c.06.14.03.3-.07.43l-.34.44c-.1.13-.12.3-.03.44.34.56 1.01 1.33 1.74 1.84.9.63 1.65.83 1.88.92.23.1.36.08.5-.05l.49-.55c.14-.16.35-.2.53-.13l1.72.81c.2.09.2.28.2.44l-.05.93Z" fill="white"/>
            </svg>
          </div>
          <h1 class="wa-start__title">Support Chat</h1>
          <p class="wa-start__sub">We reply fast. How can we help you today?</p>

          <form class="wa-start__form" data-start-form novalidate>
            <div class="wa-field">
              <label for="s-name">Your name</label>
              <input id="s-name" name="name" type="text" autocomplete="name" placeholder="Ali Khan" maxlength="80" required minlength="2">
            </div>
            <div class="wa-field">
              <label for="s-email">Email address</label>
              <input id="s-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" maxlength="254" required>
            </div>
            <div class="wa-field">
              <label for="s-phone">WhatsApp / Phone number</label>
              <input id="s-phone" name="phone" type="tel" autocomplete="tel" placeholder="+92 300 1234567" maxlength="30">
            </div>
            <div class="wa-field">
              <label for="s-order">Order number <span>(optional)</span></label>
              <input id="s-order" name="orderNumber" type="text" placeholder="VLN-AB12-CD34" maxlength="20" autocomplete="off">
            </div>
            <div class="wa-field">
              <label for="s-topic">What do you need help with?</label>
              <select id="s-topic" name="subject">
                <option value="Order &amp; Payment">Order &amp; Payment</option>
                <option value="Payment — UPI / Binance / Crypto">Payment — UPI / Binance / Crypto</option>
                <option value="Delivery question">Delivery question</option>
                <option value="Return or exchange">Return or exchange</option>
                <option value="Product question">Product question</option>
                <option value="Something else">Something else</option>
              </select>
            </div>
            <div class="wa-field">
              <label for="s-msg">Your message</label>
              <textarea id="s-msg" name="message" rows="3" maxlength="1500" required minlength="5" placeholder="e.g. I placed my order. Please send payment details."></textarea>
            </div>
            <!-- honeypot -->
            <input class="hp-field" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
            <p class="wa-error" role="alert" data-start-error></p>
            <button class="wa-start-btn" type="submit" data-start-submit>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="18" height="18" aria-hidden="true"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
              Start live chat
            </button>
          </form>

          <!-- Return to existing chat -->
          <div class="wa-start__divider"><span>or</span></div>
          <button class="wa-open-btn" type="button" data-open-existing>Open existing chat</button>
        </div>
      </div>

      <!-- ====================================================
           STEP 1b: Open existing chat form
           ==================================================== -->
      <div class="wa-existing" data-wa-existing hidden>
        <div class="wa-start__card">
          <button class="wa-back" type="button" data-back-to-start>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M19 12H5M5 12l7 7M5 12l7-7"/></svg>
            Back
          </button>
          <h2 class="wa-start__title" style="font-size:22px;">Open your chat</h2>
          <p class="wa-start__sub">Enter your Chat ID and phone number to open your conversation.</p>
          <form class="wa-existing__form" data-existing-form novalidate>
            <div class="wa-field">
              <label for="e-id">Chat ID</label>
              <input id="e-id" name="ticketId" type="text" placeholder="T-A3F9B2" maxlength="20" required>
            </div>
            <div class="wa-field">
              <label for="e-phone">Phone number</label>
              <input id="e-phone" name="phone" type="tel" placeholder="+92 300 1234567" maxlength="30" required>
            </div>
            <p class="wa-error" role="alert" data-existing-error></p>
            <button class="wa-start-btn" type="submit" data-existing-submit>Open chat</button>
          </form>
        </div>
      </div>

      <!-- ====================================================
           STEP 2: Active chat window (WhatsApp style, real-time SSE)
           ==================================================== -->
      <div class="wa-chat" data-wa-chat hidden>

        <!-- Header -->
        <div class="wa-chat__header">
          <button class="wa-chat__back" type="button" data-chat-back aria-label="Back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18"><path d="M19 12H5M5 12l7 7M5 12l7-7"/></svg>
          </button>
          <div class="wa-chat__avatar" aria-hidden="true">V</div>
          <div class="wa-chat__info">
            <strong>VELUNE Support</strong>
            <span data-chat-status-text>Checking availability…</span>
          </div>
          <div class="wa-chat__id" data-chat-header-id></div>
        </div>

        <!-- Messages -->
        <div class="wa-chat__messages" data-chat-messages aria-live="polite" aria-label="Chat messages">
          <div class="wa-chat__date-pill">Today</div>
        </div>

        <!-- Typing indicator -->
        <div class="wa-typing-line" data-chat-typing-line hidden aria-hidden="true">
          <div class="wa-typing-bubble"><span></span><span></span><span></span></div>
          <span>Support is typing…</span>
        </div>

        <!-- Attachment preview -->
        <div class="wa-attach-preview" data-contact-attach-preview hidden>
          <img alt="Payment slip preview" data-contact-attach-thumb>
          <span>Payment slip ready to send</span>
          <button type="button" aria-label="Remove attachment" data-contact-attach-clear>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="m6 6 12 12M18 6 6 18"/></svg>
          </button>
        </div>

        <!-- Payment methods panel (shown when admin configures payment methods) -->
        <div class="contact-pay" data-contact-pay hidden></div>

        <!-- Input bar -->
        <div class="wa-chat__input-bar">
          <button class="wa-attach-btn" type="button" aria-label="Attach payment slip or photo" data-contact-attach>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="20" height="20" aria-hidden="true"><path d="M20 11.5 12 19.5a5 5 0 0 1-7-7l8-8a3.5 3.5 0 0 1 5 5l-8 8a2 2 0 0 1-3-3l7-7"/></svg>
          </button>
          <input type="file" accept="image/png,image/jpeg,image/webp" hidden data-contact-file>
          <textarea class="wa-chat__textarea" data-chat-textarea placeholder="Type a message…" maxlength="2000" rows="1" aria-label="Message input"></textarea>
          <button class="wa-chat__send" type="button" data-chat-send aria-label="Send message">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="20" height="20" aria-hidden="true"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
          </button>
        </div>
        <p class="wa-footnote">Payment slips are stored only for order verification.</p>

      </div>

    </div>
  </section>
</main>

<!--@footer-->
</body>
</html>
